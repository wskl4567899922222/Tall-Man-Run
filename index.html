<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <meta name="viewport"
          content="width=device-width,
             height=device-height,
             initial-scale=1.0,
             maximum-scale=1.0,
             user-scalable=no,
             viewport-fit=cover">

    <title>Unity WebGL Player | TallManRun</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">

    <style>
         html,
         body {
             width: 100%;
             height: 100%;
             margin: 0;
             padding: 0;
             background: #ffffff;
             overflow: hidden;
         }

         body {
             display: flex;
             justify-content: center;
             align-items: center;
         }

         /* ==============================
        9:16 游戏容器
        ============================== */
         #unity-container {
             position: relative !important;
             left: auto !important;
             top: auto !important;
             transform: none !important;
             /*
        * 宽屏：
        * 高度占满，宽度按照 9:16 计算
        *
        * 窄屏：
        * 宽度占满，高度按照 9:16 计算
        */
             width: min(100vw, calc(100vh * 9 / 16));
             height: min(100vh, calc(100vw * 16 / 9));
             aspect-ratio: 9 / 16;
             background: #000000;
         }

         #unity-canvas {
             display: block;
             width: 100% !important;
             height: 100% !important;
             margin: 0 !important;
             padding: 0 !important;
             background: #000000;
         }

         /* Loading 居中到游戏窗口 */
         #unity-loading-bar {
             position: absolute;
             left: 50%;
             top: 50%;
             transform: translate(-50%, -50%);
         }

         /* 如果你不需要 Unity 默认底部工具栏，
        建议直接隐藏，否则会影响纯 9:16 视觉 */
         #unity-footer {
             display: none !important;
         }

         #unity-warning {
             position: absolute;
             left: 0;
             top: 0;
             width: 100%;
             z-index: 10;
         }
    </style>
</head>

<body>

    <div id="unity-container">

        <canvas id="unity-canvas"
                width="1080"
                height="1920"
                tabindex="-1">
        </canvas>

        <div id="unity-loading-bar">

            <div id="unity-logo"></div>

            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>

        </div>

        <div id="unity-warning"></div>

        <div id="unity-footer">
            <div id="unity-webgl-logo"></div>
            <div id="unity-fullscreen-button"></div>
            <div id="unity-build-title">TallManRun</div>
        </div>

    </div>

    <script>

        var container =
            document.querySelector("#unity-container");

        var canvas =
            document.querySelector("#unity-canvas");

        var loadingBar =
            document.querySelector("#unity-loading-bar");

        var progressBarFull =
            document.querySelector("#unity-progress-bar-full");

        var fullscreenButton =
            document.querySelector("#unity-fullscreen-button");

        var warningBanner =
            document.querySelector("#unity-warning");


        function unityShowBanner(msg, type) {

            function updateBannerVisibility() {

                warningBanner.style.display =
                    warningBanner.children.length
                        ? "block"
                        : "none";

            }

            var div = document.createElement("div");

            div.innerHTML = msg;

            warningBanner.appendChild(div);

            if (type === "error") {

                div.style =
                    "background:red;padding:10px;color:white;";

            }
            else {

                if (type === "warning") {

                    div.style =
                        "background:yellow;padding:10px;";

                }

                setTimeout(function () {

                    warningBanner.removeChild(div);

                    updateBannerVisibility();

                }, 5000);

            }

            updateBannerVisibility();

        }


        var buildUrl = "Build";

        var loaderUrl =
            buildUrl + "/911.loader.js";


        var config = {

            dataUrl:
                buildUrl + "/911.data",

            frameworkUrl:
                buildUrl + "/911.framework.js",

            codeUrl:
                buildUrl + "/911.wasm",

            streamingAssetsUrl:
                "StreamingAssets",

            companyName:
                "DefaultCompany",

            productName:
                "TallManRun",

            productVersion:
                "0.1.0",

            showBanner:
                unityShowBanner

        };


        /*
         * 手机端如果感觉性能比较差，
         * 可以打开这一句：
         *
         * config.devicePixelRatio = 1;
         *
         * 会降低实际渲染分辨率，
         * 但 WebGL 移动端性能会明显提升。
         */


        loadingBar.style.display = "block";


        var script =
            document.createElement("script");

        script.src = loaderUrl;


        script.onload = function () {

            createUnityInstance(

                canvas,

                config,

                function (progress) {

                    progressBarFull.style.width =
                        (100 * progress) + "%";

                }

            )
                .then(function (unityInstance) {

                    loadingBar.style.display = "none";

                    /*
                     * Footer 已经隐藏，
                     * 如果以后恢复 Footer，
                     * 这里仍然可以正常使用全屏按钮。
                     */
                    if (fullscreenButton) {

                        fullscreenButton.onclick =
                            function () {

                                unityInstance.SetFullscreen(1);

                            };

                    }

                })
                .catch(function (message) {

                    alert(message);

                });

        };


        document.body.appendChild(script);

    </script>

</body>
</html>
